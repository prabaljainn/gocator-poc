<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="640" viewBox="0 0 1160 640" font-family="Menlo, Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#2B2A26"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0,0 10,5 0,10" fill="#A8760D"/>
    </marker>
  </defs>
  <rect width="1160" height="640" fill="#FBFAF6"/>
  <text x="40" y="52" font-size="22" font-weight="bold" fill="#23201A">gocator-poc · bench &amp; field network</text>
  <text x="40" y="78" font-size="13" fill="#6E6858">one gigabit L2 segment · wired = static IPs, no gateway · internet stays on Wi-Fi</text>

  <!-- switch -->
  <rect x="440" y="270" width="280" height="110" rx="8" fill="#F3F1E9" stroke="#23201A" stroke-width="2"/>
  <text x="580" y="303" font-size="16" font-weight="bold" text-anchor="middle" fill="#23201A">gigabit switch</text>
  <g font-size="12" fill="#6E6858">
    <text x="580" y="326" text-anchor="middle">port 5 → Gocator</text>
    <text x="580" y="344" text-anchor="middle">port 4 → DGX Spark</text>
    <text x="580" y="362" text-anchor="middle">any port → MacBook</text>
  </g>

  <!-- gocator -->
  <rect x="60" y="120" width="290" height="120" rx="8" fill="#FFF" stroke="#A8760D" stroke-width="2.5"/>
  <text x="205" y="152" font-size="16" font-weight="bold" text-anchor="middle" fill="#A8760D">Gocator 2690</text>
  <text x="205" y="176" font-size="14" text-anchor="middle" fill="#23201A">192.168.1.10</text>
  <g font-size="12" fill="#6E6858">
    <text x="205" y="198" text-anchor="middle">laser profiler · 24–48 VDC</text>
    <text x="205" y="216" text-anchor="middle">web UI on http://192.168.1.10</text>
  </g>

  <!-- dgx -->
  <rect x="810" y="120" width="300" height="150" rx="8" fill="#FFF" stroke="#23201A" stroke-width="2.5"/>
  <text x="960" y="152" font-size="16" font-weight="bold" text-anchor="middle" fill="#23201A">DGX Spark</text>
  <text x="960" y="176" font-size="14" text-anchor="middle" fill="#23201A">wired 192.168.1.5/24 · no gw</text>
  <g font-size="12" fill="#6E6858">
    <text x="960" y="198" text-anchor="middle">GoSDK + C shim + FastAPI :8000</text>
    <text x="960" y="216" text-anchor="middle">recorder → sessions/ + SQLite</text>
    <text x="960" y="234" text-anchor="middle">Wi-Fi → internet + SSH access</text>
    <text x="960" y="256" text-anchor="middle">detect core ~2 s/frame (CPU)</text>
  </g>

  <!-- mac -->
  <rect x="440" y="470" width="280" height="120" rx="8" fill="#FFF" stroke="#23201A" stroke-width="2.5"/>
  <text x="580" y="502" font-size="16" font-weight="bold" text-anchor="middle" fill="#23201A">MacBook</text>
  <text x="580" y="526" font-size="14" text-anchor="middle" fill="#23201A">wired 192.168.1.7/24 · no gw</text>
  <g font-size="12" fill="#6E6858">
    <text x="580" y="548" text-anchor="middle">browser + dev machine</text>
    <text x="580" y="566" text-anchor="middle">Wi-Fi → internet</text>
  </g>

  <!-- links to switch -->
  <line x1="350" y1="210" x2="446" y2="292" stroke="#23201A" stroke-width="2"/>
  <text x="352" y="262" font-size="11.5" fill="#6E6858" transform="rotate(35 352 262)">port 5 · GigE</text>
  <line x1="810" y1="210" x2="716" y2="292" stroke="#23201A" stroke-width="2"/>
  <text x="726" y="246" font-size="11.5" fill="#6E6858" transform="rotate(-35 726 246)">port 4 · GigE</text>
  <line x1="580" y1="380" x2="580" y2="470" stroke="#23201A" stroke-width="2"/>

  <!-- data flows -->
  <path d="M 205 240 C 205 420, 700 420, 940 275" fill="none" stroke="#A8760D" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrg)"/>
  <text x="440" y="428" font-size="13" font-weight="bold" fill="#A8760D">surface stream · GoSDK · ~100 Mbit/s · 1 surface / 3.4 s</text>

  <path d="M 720 520 C 900 520, 1010 420, 990 276" fill="none" stroke="#2B2A26" stroke-width="2" marker-end="url(#arr)"/>
  <text x="836" y="508" font-size="13" fill="#23201A">http://192.168.1.5:8000 · dashboard + WS</text>

  <path d="M 440 520 C 260 520, 180 380, 196 246" fill="none" stroke="#2B2A26" stroke-width="2" marker-end="url(#arr)"/>
  <text x="188" y="508" font-size="13" fill="#23201A">http://192.168.1.10 · sensor web UI</text>

  <text x="40" y="618" font-size="12" fill="#6E6858">field mode: identical topology — Mac optional, phone joins via DGX hotspot or travel router</text>
</svg>
